name: Documentation and examples
on:
  push:
  pull_request:
  workflow_dispatch:

# scripts/check.sh is the one list of checks (REAS-DOC-006). Each job runs one
# of its subcommands, so the workflow and the local run cannot drift apart.
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Documentation checker and its tests
        run: scripts/check.sh docs
  rust-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt
      - name: Stable Cargo checks for every example crate
        run: scripts/check.sh rust
  # REAS-SEC-005 and REAS-TEST-003: the differential test runs on each
  # deployed CPU architecture. This example deploys nowhere, so one extra
  # architecture demonstrates the matrix.
  rust-examples-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt
      - name: Stable Cargo checks on aarch64
        run: scripts/check.sh rust
  # REAS-DATA-004: the declared rust-version compiles the crates.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - name: Check every example crate on the minimum supported Rust version
        run: |
          cargo +1.88.0 check --locked --manifest-path examples/ports-and-adapters/Cargo.toml --all-targets
          cargo +1.88.0 check --locked --manifest-path examples/typestate/Cargo.toml --all-targets
          cargo +1.88.0 check --locked --manifest-path examples/trust-boundary/Cargo.toml --all-targets
  nightly-doctests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-10-23
      - name: Install cargo-fuzz
        run: cargo +nightly-2026-10-23 install cargo-fuzz --locked
      - name: Expected diagnostic codes and the fuzz target
        run: scripts/check.sh nightly
